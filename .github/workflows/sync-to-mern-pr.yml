name: Sync Repo A to Repo B and Raise PR

on:
  push:
    branches:
      - new_source

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest

    env:
      REPO_B: Rewanshi/Containerized-MERN-STACK-TODOAPP
      SOURCE_BRANCH: new_source
      DEST_BRANCH: new_destination

    steps:
    - name: Checkout Repo A
      uses: actions/checkout@v4
      with:
        ref: ${{ env.SOURCE_BRANCH }}

    - name: Clone Repo B outside workspace
      run: |
        git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/${REPO_B}.git /tmp/repo-b
        cd /tmp/repo-b
        git fetch origin  # Ensure all branches are fetched
        git checkout $DEST_BRANCH || git checkout -b $DEST_BRANCH  # If branch doesn't exist, create it

    - name: Sync files from Repo A to Repo B
      run: |
        rsync -av --exclude='.git' $GITHUB_WORKSPACE/ /tmp/repo-b/
        cd /tmp/repo-b
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Sync changes from Repo A ($SOURCE_BRANCH)" || echo "No changes to commit"
        git pull --strategy=recursive -X theirs origin $DEST_BRANCH
        git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${REPO_B}.git $DEST_BRANCH

    - name: Create Pull Request in Repo B
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: ${{ env.REPO_B }}
        title: "Automated PR: Sync from Repo A ($SOURCE_BRANCH)"
        body: 'This PR syncs changes from Repo A branch `${{ env.SOURCE_BRANCH }}` to Repo B branch `${{ env.DEST_BRANCH }}`.'
        base: ${{ env.DEST_BRANCH }}
        head: ${{ env.DEST_BRANCH }}

        
